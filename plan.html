<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat 60 Plan</title>
<style>
  :root { --bg:#fafaf7; --ink:#1d1d1b; --muted:#8a8a84; --wall:#1d1d1b; --room:#ffffff;
          --glass:#3a7bd5; --door:#d0542c; --shaft:#c9c6bd; --balc:#eef3ea; --grid:#ecebe5; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { padding:12px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  label { color:var(--muted); display:flex; gap:6px; align-items:center; }
  svg { display:block; width:100%; max-width:900px; height:auto; margin:0 auto 24px; }
  .dim { font-size:0.16px; fill:var(--muted); }
  .rname { font-size:0.30px; font-weight:600; }
  .rarea { font-size:0.22px; fill:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Flat plan — 8th floor (1 unit = 1 m)</h1>
  <label>Original overlay <input id="ov" type="range" min="0" max="100" value="0"></label>
  <label><input id="g" type="checkbox" checked> 0.5 m grid</label>
  <label>Bathroom <select id="bath"></select></label>
  <label style="color:#e0218a;font-weight:600"><input id="mk" type="checkbox"> Mark mode</label>
  <label>Label for next click <input id="lbl" type="text" value="WC drain" style="width:160px"></label>
  <button id="copy">Copy marks for Claude</button>
  <ol id="list" style="flex-basis:100%;margin:0;padding-left:20px;color:#e0218a"></ol>
  <textarea id="out" readonly rows="2" style="flex-basis:100%;display:none;font:12px monospace"></textarea>
</header>
<svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>

<script src="plan-data.js?v=2026-11-22f"></script>
<script>
/* ================= DATA MODEL (all metres) =================
   Origin (0,0) = inner top-left corner of room 60-1 (living room).
   x → east (right), y → south (down, toward the stair corridor).
   Edit these arrays to change the design. */
const PLAN = window.PLAN;

/* ================= RENDERER ================= */
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("plan");
const VB={x:-1.0,y:-2.4,w:8.4,h:11.0};
svg.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};

function draw(){
  svg.innerHTML="";
  const showGrid=document.getElementById("g").checked;
  if(showGrid){const g=el("g",{stroke:"var(--grid)","stroke-width":0.01});
    for(let x=-1;x<=7.5;x+=0.5)el("line",{x1:x,y1:VB.y,x2:x,y2:VB.y+VB.h},g);
    for(let y=-2.5;y<=8.6;y+=0.5)el("line",{x1:VB.x,y1:y,x2:VB.x+VB.w,y2:y},g);}
  const b=PLAN.balcony;
  el("rect",{x:b.x,y:b.y,width:b.w,height:b.h,fill:"var(--balc)",stroke:"var(--ink)","stroke-width":0.02});
  // floor of the flat
  el("rect",{x:0,y:0,width:6.49,height:7.88,fill:"var(--room)"});
  PLAN.shafts.forEach(s=>el("polygon",{points:s.map(p=>p.join(",")).join(" "),fill:"var(--shaft)",stroke:"var(--wall)","stroke-width":0.02}));
  PLAN.walls.forEach(([x,y,w,h])=>el("rect",{x,y,width:w,height:h,fill:"var(--wall)"}));
  PLAN.windows.forEach(([x1,y1,x2,y2,t,label,opt])=>{
    const horiz=y1===y2, g=el("g",{stroke:"var(--glass)","stroke-width":0.02});
    [-t/2,-t/6,t/6,t/2].forEach(o=>el("line",horiz?{x1,y1:y1+o,x2,y2:y2+o}:{x1:x1+o,y1,x2:x2+o,y2},g));
    if(opt&&opt.split&&horiz) el("line",{x1:opt.split,y1:y1-t/2,x2:opt.split,y2:y1+t/2,stroke:"var(--glass)","stroke-width":0.04}); // mullion fixed|door
  });
  PLAN.openings.forEach(([x1,y1,x2,y2])=>el("line",{x1,y1,x2,y2,stroke:"var(--door)","stroke-width":0.05,"stroke-dasharray":"0.08 0.05"}));
  const rad=d=>d*Math.PI/180;
  PLAN.doorLeaves.forEach(d=>{
    const [hx,hy]=d.hinge, c=[hx+d.len*Math.cos(rad(d.closed)),hy+d.len*Math.sin(rad(d.closed))],
          o=[hx+d.len*Math.cos(rad(d.open)),hy+d.len*Math.sin(rad(d.open))];
    // sweep flag: direction from closed to open
    const sweep=((d.open-d.closed+360)%360)<180?1:0;
    el("line",{x1:hx,y1:hy,x2:o[0],y2:o[1],stroke:"var(--door)","stroke-width":0.04});
    el("path",{d:`M${c[0]} ${c[1]} A${d.len} ${d.len} 0 0 ${sweep} ${o[0]} ${o[1]}`,fill:"none",stroke:"var(--door)","stroke-width":0.015,"stroke-dasharray":"0.05 0.04"});
  });
  // electrical points (estimates from site photos): purple dot + id; ceiling points as ring
  const seenE={};
  (PLAN.electrical||[]).forEach(e=>{
    const key=e.x+","+e.y, dup=(seenE[key]=(seenE[key]||0)+1)-1;
    const dx = e.wall==="W"?0.07 : e.wall==="E"?-0.07 : e.wall==="P"?-0.07 : 0;
    const cx=e.x+dx, cy=e.y, ceil=e.wall==="C";
    el("circle",{cx,cy,r:0.055,fill:ceil?"#fff":"#7a3fb0",stroke:"#7a3fb0","stroke-width":0.02});
    const tx = e.wall==="E"||e.wall==="P" ? cx-0.09 : cx+0.09;
    el("text",{x:tx,y:cy+0.04+dup*0.14,"text-anchor":e.wall==="E"||e.wall==="P"?"end":"start",style:"font-size:0.11px;font-weight:600;fill:#7a3fb0"})
      .textContent=`${e.id}${ceil?"":" @"+Math.round(e.z*100)}`;
  });
  (PLAN.pipes||[]).forEach(p=>{   // overhead pipe: dashed (it's at ceiling level)
    el("line",{x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,stroke:"#8f8b82","stroke-width":p.d,"stroke-dasharray":"0.12 0.06",opacity:0.8});
    el("text",{x:p.x1-0.12,y:(p.y1+p.y2)/2-0.6,"text-anchor":"middle",transform:`rotate(-90 ${p.x1-0.12} ${(p.y1+p.y2)/2-0.6})`,
      style:"font-size:0.11px;fill:#8f8b82"}).textContent=p.label;
  });
  PLAN.services.forEach(s=>{
    el("rect",{x:s.x-0.08,y:s.y-0.08,width:0.16,height:0.16,fill:"#1f6fd1",stroke:"#fff","stroke-width":0.02});
    const lay=PLAN.layouts.bathroom[document.getElementById("bath").value]||[];
    if(s.x>3.86 && lay.length) return; // bathroom fixtures already show it
    const left=s.x>4.5; // keep bathroom labels inside the room
    el("text",{x:s.x+(left?-0.13:0.13),y:s.y+0.06,"text-anchor":left?"end":"start",style:"font-size:0.17px;font-weight:600;fill:#1f6fd1"}).textContent=s.label;
  });
  PLAN.marks.forEach((m,i)=>{
    el("circle",{cx:m.x,cy:m.y,r:0.09,fill:"#e0218a",stroke:"#fff","stroke-width":0.02});
    el("text",{x:m.x+0.13,y:m.y+0.06,style:"font-size:0.18px;font-weight:600;fill:#e0218a"}).textContent=`${i+1} ${m.label}`;
  });
  drawLayout(PLAN.layouts.bathroom[document.getElementById("bath").value]||[]);
  // Shaft walls are fixed structure: draw them last, thick, so no design item can hide them
  PLAN.shafts.forEach(s=>el("polygon",{points:s.map(p=>p.join(",")).join(" "),fill:"none",stroke:"var(--wall)","stroke-width":0.07,"stroke-linejoin":"miter"}));
  renderList();
  PLAN.rooms.forEach(r=>{
    const sm=r.small?"font-size:0.18px":"", sa=r.small?"font-size:0.11px":"";
    el("text",{x:r.at[0],y:r.at[1],class:"rname","text-anchor":"middle",style:sm}).textContent=r.id;
    el("text",{x:r.at[0],y:r.at[1]+(r.small?0.17:0.3),class:"rarea","text-anchor":"middle",style:sa}).textContent=`${r.name} · ${r.area} m²`;});
  const bathBusy=(PLAN.layouts.bathroom[document.getElementById("bath").value]||[]).length>0;
  PLAN.dims.filter(d=>!(d[4]==="bath"&&bathBusy)).forEach(([x,y,t,rot])=>el("text",{x,y,class:"dim","text-anchor":"middle",transform:rot?`rotate(${rot} ${x} ${y})`:""}).textContent=t);
  const o=PLAN.overlay, op=document.getElementById("ov").value/100;
  if(op>0) el("image",{href:o.href,x:o.x,y:o.y,width:o.w,height:o.h,opacity:op,preserveAspectRatio:"none"});
}
/* ===== Furniture / fixture renderer ===== */
function drawLayout(items){
  const F={fill:"#fff",stroke:"#5b5b55","stroke-width":0.02};
  const lbl=(x,y,t,size=0.12)=>el("text",{x,y,"text-anchor":"middle",style:`font-size:${size}px;fill:#5b5b55`}).textContent=t;
  items.forEach(it=>{
    const {k,x,y,w,h}=it, cx=x+(w||0)/2, cy=y+(h||0)/2;
    if(k==="glass"){el("line",{x1:x,y1:y,x2:it.x2,y2:it.y2,stroke:"var(--glass)","stroke-width":0.04});return;}
    if(k==="slider"){
      el("rect",{x,y,width:w,height:h,fill:"var(--door)"});
      el("path",{d:`M${x-0.06} ${y+h} l0 ${0.89} `,stroke:"var(--door)","stroke-width":0.015,"stroke-dasharray":"0.05 0.04",fill:"none"});
      el("text",{x:x-0.08,y:y+h/2,"text-anchor":"middle",transform:`rotate(-90 ${x-0.08} ${y+h/2})`,style:"font-size:0.11px;fill:var(--door)"}).textContent=it.label;
      return;}
    if(k==="box"){el("rect",{x,y,width:w,height:h,fill:"#e9e6dc",stroke:"#5b5b55","stroke-width":0.015});if(it.label)lbl(cx,cy+0.04,it.label,0.1);return;}
    if(k==="note"){lbl(x,y,it.label,0.09);return;}
    if(k==="mirror") return; // wall-mounted above the vanity: shown in 3D only
    if(k==="trim"){el("rect",{x,y,width:w,height:h,fill:"#5a3a24"});return;}
    if(k==="upper"){el("rect",{x,y,width:w,height:h,fill:"none",stroke:"#5b5b55","stroke-width":0.012,"stroke-dasharray":"0.04 0.03"});return;}
    if(k==="towel"){el("rect",{x,y,width:w,height:h,fill:"#f6d7c9",stroke:"var(--door)","stroke-width":0.015});
      for(let i=1;i<5;i++)el("line",{x1:x+w*i/5,y1:y,x2:x+w*i/5,y2:y+h,stroke:"var(--door)","stroke-width":0.01});
      lbl(cx,y+h+0.13,it.label,0.1);return;}
    el("rect",{x,y,width:w,height:h,...F});
    if(k==="wc"){ // tank side at the bottom (against shaft), bowl pointing north
      el("ellipse",{cx,cy:y+h*0.42,rx:w*0.42,ry:h*0.40,...F});
      lbl(cx,y-0.05,it.label,0.1);}
    else if(k==="basin"){el("ellipse",{cx,cy:cy+0.02,rx:w*0.28,ry:h*0.30,...F});lbl(cx,y+h+0.13,it.label);}
    else if(k==="shower"){
      el("line",{x1:x,y1:y,x2:x+w,y2:y+h,stroke:"#c8c6be","stroke-width":0.01});
      el("line",{x1:x+w,y1:y,x2:x,y2:y+h,stroke:"#c8c6be","stroke-width":0.01});
      el("rect",{x:cx-0.3,y:y+h-0.12,width:0.6,height:0.04,fill:"#5b5b55"}); // linear drain
      lbl(cx,y+0.3,it.label,0.11);}
    else if(k==="bath"){el("rect",{x:x+0.07,y:y+0.07,width:w-0.14,height:h-0.14,rx:0.25,...F});lbl(cx,cy+0.04,it.label);}
    else if(k==="washer"){el("circle",{cx,cy,r:Math.min(w,h)*0.33,...F});lbl(cx,cy+0.04,it.label,0.09);}
  });
}
{const s=document.getElementById("bath");
 Object.keys(PLAN.layouts.bathroom).forEach(n=>{const o=document.createElement("option");o.textContent=n;s.appendChild(o);});
 try{const v=localStorage.getItem("flat60-bath-v2"); if(v&&PLAN.layouts.bathroom[v]) s.value=v;}catch(e){}
 s.onchange=()=>{try{localStorage.setItem("flat60-bath-v2",s.value);}catch(e){} draw();};}

/* ===== Mark tool: click the plan to drop labelled points ===== */
const KEY="flat60-marks-v2"; // v1 marks were moved into PLAN.services
try{const s=JSON.parse(localStorage.getItem(KEY)||"[]"); if(Array.isArray(s)) PLAN.marks=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(PLAN.marks));}catch(e){}};
const r2=v=>Math.round(v*100)/100;
svg.addEventListener("click",ev=>{
  if(!document.getElementById("mk").checked) return;
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const label=(document.getElementById("lbl").value||"point").trim();
  PLAN.marks.push({x:r2(p.x),y:r2(p.y),label}); save(); draw();
});
function renderList(){
  const ul=document.getElementById("list"); ul.innerHTML="";
  PLAN.marks.forEach((m,i)=>{const li=document.createElement("li");
    li.textContent=`${m.label} — x ${m.x}, y ${m.y} `;
    const b=document.createElement("button"); b.textContent="✕"; b.onclick=()=>{PLAN.marks.splice(i,1);save();draw();};
    li.appendChild(b); ul.appendChild(li);});
  const out=document.getElementById("out");
  out.value=PLAN.marks.length?"marks: "+JSON.stringify(PLAN.marks):"";
  out.style.display=PLAN.marks.length?"block":"none";
}
document.getElementById("copy").onclick=()=>{
  const out=document.getElementById("out"), btn=document.getElementById("copy");
  out.select();
  let ok=false; try{ok=document.execCommand("copy");}catch(e){}
  const done=()=>{btn.textContent="Copied ✓";setTimeout(()=>btn.textContent="Copy marks for Claude",1500);};
  if(ok) return done();
  try{navigator.clipboard.writeText(out.value).then(done,()=>{btn.textContent="Select the text box & Ctrl+C";});}
  catch(e){btn.textContent="Select the text box & Ctrl+C";}
};
document.getElementById("ov").oninput=draw;
document.getElementById("g").onchange=draw;
draw();
</script>
<script>window.COMMENTS_PAGE = "2d";</script>
<script src="comments.js?v=1"></script>
</body>
</html>
