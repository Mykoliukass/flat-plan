<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat 60 3D</title>
<style>
  :root { --bg:#f3f2ee; --ink:#1d1d1b; --muted:#7a7a74; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui, sans-serif; }
  header { position:fixed; top:0; left:0; right:0; padding:8px 12px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
           background:rgba(243,242,238,.92); border-bottom:1px solid #ddd; z-index:2; }
  h1 { font-size:14px; margin:0; }
  label { color:var(--muted); display:flex; gap:5px; align-items:center; }
  button { font:inherit; padding:3px 8px; }
  #tip { position:fixed; pointer-events:none; background:#1d1d1b; color:#fff; padding:3px 7px; border-radius:4px; font-size:12px; display:none; z-index:3; }
  #help { position:fixed; bottom:8px; left:12px; color:var(--muted); font-size:12px; }
  canvas { display:block; }
</style>
</head>
<body>
<header>
  <h1>Flat 60 — 3D</h1>
  <label>Bathroom <select id="bath"></select></label>
  <label>Ceiling <input id="ceil" type="number" step="0.05" min="2.4" max="3.2" value="2.70" style="width:60px" title="Z1–Z4 (provisional)"> m</label>
  <label>Finish <select id="finish"><option value="style">Green tiles + walnut + brass</option><option value="plain">Plain (layout only)</option></select></label>
  <label><input id="cut" type="checkbox"> Cut walls at 1.2 m</label>
  <span>View:</span>
  <button data-v="bath">Bathroom</button>
  <button data-v="door">From the doorway</button>
  <button data-v="flat">Whole flat</button>
  <label>Center on <select id="focus">
    <option value="">—</option>
    <option value="1.86,1.0,2.8">Living room</option>
    <option value="0.9,1.0,5.3">Kitchen corner</option>
    <option value="5.17,1.0,2.7">Bedroom</option>
    <option value="5.17,0.9,6.7">Bathroom</option>
    <option value="2.0,1.0,7.0">Hall</option>
    <option value="3.4,0.8,-1.2">Balcony</option>
    <option value="3.25,0.0,3.9">Whole flat (middle)</option>
  </select></label>
  <a href="plan.html" style="margin-left:auto">2D plan</a>
</header>
<div id="tip"></div>
<div id="help">Drag to rotate · right-drag / two-finger to pan · scroll to zoom · <b>double-click</b> any spot to rotate around it · hover an item for its name</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="plan-data.js?v=2026-11-22f"></script>
<script>
/* Plan coordinates (x east, y south, metres) map to three.js as  x → x,  y → z,  height → y. */
const P = window.PLAN;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3f2ee);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(0xffffff, 0xb9b3a6, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-4, 9, -6); scene.add(sun);

const C = { wall:0xe9e7e1, shaft:0xbdb9ae, floor:0xcbbda6, tile:0xc9ccce, white:0xfbfbfb, wood:0xb88b5e,
            box:0xdedbd2, glass:0x9cc3e6, steel:0xa9adb2, rail:0xd0542c, mirror:0xcfe3ee, door:0xc6a27c };
let world = new THREE.Group(); scene.add(world);
const pickables = [];

function mat(c, opts={}) {
  if (c && c.isMaterial) return c;
  const o = Object.assign({color:c}, opts); delete o.noEdges;
  return new THREE.MeshLambertMaterial(o);
}
// Box from plan rect (x,y,w,d) and height range z0..z1
function box(x,y,w,d,z0,z1,color,label,opts={}) {
  const g = new THREE.BoxGeometry(w, z1-z0, d);
  const m = new THREE.Mesh(g, mat(color, opts));
  m.position.set(x+w/2, (z0+z1)/2, y+d/2);
  world.add(m);
  if (!opts.transparent && !opts.noEdges && !(color && color.isMaterial && S)) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color:0x6b6b66}));
    e.position.copy(m.position); world.add(e);
  }
  if (label) { m.userData.label = label; pickables.push(m); }
  return m;
}
function prism(poly, z0, z1, color, label) {           // extruded plan polygon
  const s = new THREE.Shape(poly.map(([x,y]) => new THREE.Vector2(x, -y)));
  const g = new THREE.ExtrudeGeometry(s, {depth:z1-z0, bevelEnabled:false});
  g.rotateX(-Math.PI/2); g.translate(0, z0, 0);
  const m = new THREE.Mesh(g, mat(color)); world.add(m);
  world.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color:0x55554f})));
  if (label) { m.userData.label = label; pickables.push(m); }
}

function cyl(x, y, z0, z1, r, color, label) {         // vertical cylinder at plan point (x,y)
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, z1 - z0, 20), mat(color));
  m.position.set(x, (z0 + z1) / 2, y); world.add(m);
  if (label) { m.userData.label = label; pickables.push(m); }
  return m;
}

/* ================= FINISHES ("Green & walnut" style from the reference photo) ================= */
let S = false;                                  // style on/off, set in build()
const PAL = { tile:"#1f5c40", grout:"#c9cfc6", walnut:"#3a2416", brass:0xb8914a, marble:"#efebe5",
              floor:"#e4ddd0", white:0xfbfaf6, mirror:0xc9d6da, glass:0xbfd8e6 };
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TEX = {
  // 2 vertical tiles of 7.5 × 30 cm, stack-bonded, glossy green with light grout  → covers 0.15 × 0.30 m
  tile: { u:0.15, v:0.30, t: canvasTex(128, 256, (g, w, h) => {
    g.fillStyle = PAL.grout; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2; i++) {
      const x = i * 64 + 2, shade = [ "#1d5a3e", "#226446", "#1a5239" ][i % 3];
      const gr = g.createLinearGradient(x, 0, x + 60, h);
      gr.addColorStop(0, shade); gr.addColorStop(0.45, "#2b7352"); gr.addColorStop(1, shade);
      g.fillStyle = gr; g.fillRect(x, 2, 60, h - 4);
      g.fillStyle = "rgba(255,255,255,0.10)"; g.fillRect(x + 6, 10, 8, h - 20);       // glaze highlight
    } }) },
  // dark walnut panelling, vertical grain → covers 0.5 × 1.0 m
  walnut: { u:0.5, v:1.0, t: canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = PAL.walnut; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, a = 0.05 + rnd() * 0.12;
      g.strokeStyle = rnd() > 0.5 ? `rgba(120,78,48,${a})` : `rgba(15,8,4,${a})`;
      g.lineWidth = 0.5 + rnd() * 2.5; g.beginPath(); g.moveTo(x, 0);
      g.bezierCurveTo(x + rnd() * 8 - 4, h * 0.33, x + rnd() * 8 - 4, h * 0.66, x + rnd() * 6 - 3, h); g.stroke();
    } }) },
  // white marble with grey veins → covers 1.0 × 0.5 m
  marble: { u:1.0, v:0.5, t: canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = PAL.marble; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9; i++) {
      g.strokeStyle = `rgba(120,120,125,${0.15 + rnd() * 0.3})`; g.lineWidth = 0.5 + rnd() * 1.5;
      g.beginPath(); let x = rnd() * w, y = 0; g.moveTo(x, y);
      while (y < h) { x += rnd() * 40 - 20; y += 15 + rnd() * 25; g.lineTo(x, y); } g.stroke();
    } }) },
  // cream floor tiles 60 × 60 → covers 0.6 × 0.6 m
  floor: { u:0.6, v:0.6, t: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = PAL.floor; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#cfc6b6"; g.lineWidth = 3; g.strokeRect(0, 0, w, h); }) },
  // vintage rug (dark green / red / cream) → covers whole rug
  rug: { u:1, v:1, t: canvasTex(256, 384, (g, w, h) => {
    g.fillStyle = "#5b1e1a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#e8dcc2"; g.fillRect(14, 14, w - 28, h - 28);
    g.fillStyle = "#16473a"; g.fillRect(26, 26, w - 52, h - 52);
    g.fillStyle = "#e8dcc2"; g.beginPath(); g.moveTo(w/2, 50); g.lineTo(w - 50, h/2); g.lineTo(w/2, h - 50); g.lineTo(50, h/2); g.closePath(); g.fill();
    g.fillStyle = "#7a2a22"; g.beginPath(); g.moveTo(w/2, 90); g.lineTo(w - 85, h/2); g.lineTo(w/2, h - 90); g.lineTo(85, h/2); g.closePath(); g.fill();
    for (let i = 0; i < 400; i++) { g.fillStyle = ["#c79b4b","#16473a","#7a2a22","#e8dcc2"][i % 4]; g.fillRect(rnd() * w, rnd() * h, 3, 3); }
  }) },
};
// material with the texture scaled to a real-world face size (w × h metres)
function tmat(key, w, h, shiny=false) {
  const T = TEX[key], t = T.t.clone(); t.needsUpdate = true; t.repeat.set(w / T.u, h / T.v);
  return shiny ? new THREE.MeshPhongMaterial({map:t, shininess:90, specular:0x444444})
               : new THREE.MeshLambertMaterial({map:t});
}
const brass = () => new THREE.MeshPhongMaterial({color:PAL.brass, shininess:70, specular:0x886633});
// vertical finish panel along a plan line (x1,y1)→(x2,y2) from height z0 to z1
function panel(x1, y1, x2, y2, z0, z1, key, label) {
  if (z1 <= z0) return;
  const L = Math.hypot(x2 - x1, y2 - y1), g = new THREE.PlaneGeometry(L, z1 - z0);
  const m = tmat(key, L, z1 - z0, key === "tile"); m.side = THREE.DoubleSide;
  const p = new THREE.Mesh(g, m);
  p.rotation.y = -Math.atan2(y2 - y1, x2 - x1);
  p.position.set((x1 + x2) / 2, (z0 + z1) / 2, (y1 + y2) / 2); world.add(p);
  if (label) { p.userData.label = label; pickables.push(p); }
}
// tiled wall section from z0 to z1 (green gloss tiles)
function tileWall(x1, y1, x2, y2, z0, z1) {
  panel(x1, y1, x2, y2, z0, z1, "tile", "green gloss tiles 7.5×30");
}
// Bathroom finishes (owner, 2026-11-22): green tiles on ALL walls, floor to ceiling.
// Walnut only on furniture: vanity, cabinets, service column, laundry-bay framing, recessed cabinet above the WC.
function bathroomFinishes(WH) {
  const o = 0.004;
  tileWall(3.85, 5.59 + o, 6.49, 5.59 + o, 0, WH);          // north wall (bedroom side), incl. bath alcove
  tileWall(6.49 - o, 5.59, 6.49 - o, 7.395, 0, WH);         // east (outer) wall in the bath alcove
  tileWall(5.42, 7.395 - o, 6.49, 7.395 - o, 0, WH);        // back wall: bath end + shaft face beside WC
  // WC recess: tiles on the frame front up to 1.20, recessed walnut cabinet from 1.20 to the ceiling
  tileWall(4.87, 7.395 - o, 5.42, 7.395 - o, 0, 1.20);   // above 1.20 the walnut cabinet runs to the ceiling
  tileWall(3.85, 7.88 - o, 4.47, 7.88 - o, 0, WH);          // corridor wall behind the laundry bay
  tileWall(3.85 + o, 5.59, 3.85 + o, 6.18, 0, WH);          // west wall, either side of the doorway
  tileWall(3.85 + o, 7.08, 3.85 + o, 7.88, 0, WH);
  const DH = (P.heights||{}).doorway || 2.05;
  if (WH > DH) tileWall(3.85 + o, 6.18, 3.85 + o, 7.08, DH, WH);   // above the doorway
}

function build() {
  scene.remove(world); world = new THREE.Group(); scene.add(world); pickables.length = 0;
  const H = Math.max(2.3, parseFloat(document.getElementById("ceil").value) || 2.7);
  const WH = document.getElementById("cut").checked ? 1.2 : H;     // displayed wall height
  const HT = P.heights || {}, DOOR = HT.doorway || 2.05, SILL = 0, HEAD = HT.windowTop || 2.20;   // measured: windows go to the floor

  const layoutName = document.getElementById("bath").value;
  S = document.getElementById("finish").value === "style";
  hemi.color.set(S ? 0xfff0dc : 0xffffff); hemi.intensity = S ? 0.75 : 0.85;

  // floors
  box(0,0,6.49,7.88,-0.02,0,C.floor);
  box(3.85,5.59,2.64,2.29,-0.019,0.001, S ? tmat("floor",2.64,2.29) : C.tile,"bathroom floor (cream tiles, floor heating)");
  const b = P.balcony; box(b.x,b.y,b.w,b.h,-0.12,-0.02,C.box,"balcony");
  box(b.x,b.y,b.w,0.03,-0.02,1.0,C.glass,"balcony railing",{transparent:true,opacity:0.35});

  // structural walls
  P.walls.forEach(([x,y,w,d]) => box(x,y,w,d,0,WH,C.wall));
  // lintels over interior openings and the entrance
  P.openings.forEach(([x1,y1,x2,y2]) => { if (WH > DOOR) box(3.72,Math.min(y1,y2),0.13,Math.abs(y2-y1),DOOR,WH,C.wall); });
  if (WH > DOOR) box(2.35,7.88,1.05,0.20,DOOR,WH,C.wall);
  // windows: sill + head + glass
  P.windows.forEach(([x1,y1,x2,y2,t,wlabel,opt],i) => {
    const hor = y1===y2, rx = hor?Math.min(x1,x2):x1-t/2, ry = hor?y1-t/2:Math.min(y1,y2),
          rw = hor?Math.abs(x2-x1):t, rd = hor?t:Math.abs(y2-y1), sill = SILL;
    if (sill>0) box(rx,ry,rw,rd,0,Math.min(sill,WH),C.wall);
    if (WH > HEAD) box(rx,ry,rw,rd,HEAD,WH,C.wall);
    const gl = Math.min(HEAD,WH);
    if (gl > sill) box(hor?rx:rx+t/2-0.01, hor?ry+t/2-0.01:ry, hor?rw:0.02, hor?0.02:rd, sill, gl, C.glass,
                       i===0?"balcony door + window":"window", {transparent:true,opacity:0.35});
    // window frames: white PVC mullion between fixed part and door, cross bar on the fixed part
    if (opt && gl > 0) {
      if (hor) {
        const fy = ry + t/2 - 0.04;
        if (opt.split) box(opt.split-0.035, fy, 0.07, 0.08, 0, gl, 0xf4f4f2, "window mullion (fixed | door)");
        if (opt.transom && opt.transom < gl) box(rx, fy, (opt.split||rx+rw)-rx, 0.08, opt.transom-0.035, opt.transom+0.035, 0xf4f4f2,
                                                 "window cross bar (~1.05 m)");
      } else {
        const fx = rx + t/2 - 0.04;
        if (opt.transom && opt.transom < gl) box(fx, ry, 0.08, rd, opt.transom-0.035, opt.transom+0.035, 0xf4f4f2, "window cross bar (~1.05 m)");
      }
    }
  });
  // existing service points (kitchen pipes as in the site photo, WC drain stub, hall boxes)
  (P.services||[]).forEach(sv => {
    if (sv.kind === "kitchen") {
      const wy = 6.005 - 0.04;                                    // just in front of the plasterboard kitchen wall
      const hot = mat(0xc0392b), cold = mat(0x2f6fd0), top = 0.85;
      cyl(sv.x + 0.06, wy, 0, top - 0.06, 0.014, hot, "hot water pipe (kitchen)");   // seen from the room: red left, blue right
      cyl(sv.x - 0.06, wy, 0, top - 0.06, 0.014, cold, "cold water pipe (kitchen)");
      const arc = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 10, 24, Math.PI), mat(0xf2f2f0));
      arc.position.set(sv.x, top - 0.06, wy); world.add(arc);    // white loop joining them (as in the photo)
      cyl(sv.x - 0.10, wy + 0.02, 0, 0.06, 0.03, mat(0x8c8c8c), "kitchen drain stub (Ø50, from the floor)");
    } else if (sv.kind === "wcDrain") {
      cyl(sv.x, sv.y + 0.04, 0, 0.04, 0.055, mat(0x8c8c8c), "WC drain stub (Ø110)");
    } else if (sv.kind === "boxes") {
      const fy = 7.88 - 0.10;                                     // flush boxes in the corridor wall, hall side
      box(sv.x - 0.30, fy, 0.30, 0.10, 1.45, 1.90, 0xdedede, "electrical panel (size/height approx.)");
      box(sv.x + 0.05, fy, 0.55, 0.10, 0.35, 0.90, 0xe8e2d4, "floor-heating manifold box (size/height approx.)");
    }
  });
  // electrical points (estimates from photos): small boxes on the wall, rings on the ceiling
  (P.electrical||[]).forEach(e => {
    if (e.wall === "C") { if (WH >= H) box(e.x-0.06, e.y-0.06, 0.12, 0.12, H-0.03, H, 0x7a3fb0, `${e.id}: ${e.label}`); return; }
    if (e.z > WH) return;
    const n = e.n || 1;
    for (let k = 0; k < n; k++) {
      const off = (k - (n-1)/2) * 0.075, sz = 0.07;
      if (e.wall === "W") box(0.0, e.y+off-sz/2, 0.012, sz, e.z-sz/2, e.z+sz/2, 0x7a3fb0, `${e.id}: ${e.label} (≈${Math.round(e.z*100)} cm)`);
      if (e.wall === "E") box(6.478, e.y+off-sz/2, 0.012, sz, e.z-sz/2, e.z+sz/2, 0x7a3fb0, `${e.id}: ${e.label} (≈${Math.round(e.z*100)} cm)`);
      if (e.wall === "P") box(3.708, e.y+off-sz/2, 0.012, sz, e.z-sz/2, e.z+sz/2, 0x7a3fb0, `${e.id}: ${e.label} (≈${Math.round(e.z*100)} cm)`);
    }
  });
  // shafts (fixed)
  P.shafts.forEach(s => prism(s, 0, WH, C.shaft, "service shaft (fixed)"));
  // pipes under the ceiling (measured bottom heights at each end)
  (P.pipes||[]).forEach(p => {
    const a = new THREE.Vector3(p.x1, p.zBottom1 + p.d/2, p.y1), b = new THREE.Vector3(p.x2, p.zBottom2 + p.d/2, p.y2);
    if (Math.min(a.y, b.y) - p.d/2 > WH) return;
    const g = new THREE.CylinderGeometry(p.d/2, p.d/2, a.distanceTo(b), 20);
    const m = new THREE.Mesh(g, mat(0x8f8b82)); m.position.copy(a.clone().add(b).multiplyScalar(0.5));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
    world.add(m); m.userData.label = p.label + " — Ø and wall gap assumed"; pickables.push(m);
  });

  // entrance door leaf (closed)
  box(2.35,7.91,1.05,0.05,0,Math.min(DOOR,WH),C.door,"entrance door (opens inward)");

  // bathroom design items
  const items = P.layouts.bathroom[layoutName] || [];
  if (S && layoutName.startsWith("C")) {
    bathroomFinishes(WH);
    // rug in front of the vanity
    const r = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.6), tmat("rug", 1, 1));
    r.rotation.x = -Math.PI / 2; r.position.set(4.40, 0.004, 6.42); world.add(r);
    r.userData.label = "rug"; pickables.push(r);
  }
  items.forEach(it => addItem(it, WH));
}

function addItem(it, WH) {
  const {k,x,y,w,h,label} = it, clip = z => z === "ceiling" ? WH : Math.min(z, Math.max(WH, 2.3));
  // material helpers: styled vs plain
  const WAL = (a,b) => S ? tmat("walnut",a,b) : C.wood;
  const MET = () => S ? brass() : C.steel;
  const WHT = S ? PAL.white : C.white;
  switch (k) {
    case "bath": {
      if (S) {   // tiled apron, white tub inside
        box(x,y,w,h,0,0.56,tmat("tile",Math.max(w,h),0.56,true),"bath, front panel tiled");
        box(x,y,w,h,0.56,0.58,WHT,label);
      } else box(x,y,w,h,0,0.58,WHT,label);
      box(x+0.08,y+0.08,w-0.16,h-0.16,0.581,0.585,0xdfe9ef,label);           // inner tub
      box(x+w/2-0.04,y+h-0.12,0.08,0.08,0.80,0.90,MET(),"bath / shower mixer (thermostatic)");
      box(x+w/2-0.015,y+h-0.05,0.03,0.03,0.95,2.10,MET(),"shower slide rail + hand shower");
      if (S) {   // rain head on an arm, like the photo
        box(x+w/2-0.015,y+h-0.40,0.03,0.38,2.08,2.11,MET(),"shower arm");
        const rh = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.015,32), brass());
        rh.position.set(x+w/2, 2.06, y+h-0.40); world.add(rh);
      }
      break; }
    case "shower":
      box(x,y,w,h,0,0.03,C.tile,label); break;
    case "glass": {
      const hor = it.y===it.y2, z0 = 0.58;
      box(hor?Math.min(x,it.x2):x-0.005, hor?y-0.005:Math.min(y,it.y2), hor?Math.abs(it.x2-x):0.01, hor?0.01:Math.abs(it.y2-y),
          z0, 2.0, S ? PAL.glass : C.glass, "fixed glass screen", {transparent:true,opacity:S?0.22:0.35});
      if (S && !hor) {   // brass profile on the wall edge and the free edge
        const y0 = Math.min(y,it.y2), y1 = Math.max(y,it.y2);
        box(x-0.01,y1-0.015,0.02,0.015,z0,2.0,brass(),"brass glass profile");
        box(x-0.01,y0,0.02,0.015,z0,2.0,brass(),"brass glass profile");
      }
      break; }
    case "wc":
      box(x,y,w,h,0.30,0.42,WHT,label);
      box(x,y,w,h-0.02,0.42,0.44,WHT,"WC seat (≈44 cm)"); break;
    case "box":
      if (it.role==="frame") {
        box(x,y,w,h,it.z0??0,clip(it.z1??1.2),C.box,"WC frame in the shaft recess (slim 8 cm cistern), flush with the wall");
        box(x+w/2-0.12,y-0.012,0.24,0.01,1.00,1.15,MET(),"flush plate");
      } else
        box(x,y,w,h,it.z0??0,clip(it.z1??1.2), it.role==="service"?WAL(w,clip(it.z1??1.2)):C.box,
            it.role==="service" ? "service column (flush): water valve, siphon, 2 sockets, detergents" : (it.label||"boxing"));
      break;
    case "upper":
      if (WH > (it.z0??1.45)) {
        const z0 = it.z0??1.45, z1 = clip(it.z1??2.15);
        box(x,y,w,h,z0,z1,WAL(w,z1-z0),it.label||"upper cabinet");
        if (S) box(x+w/2-0.08,y-0.015,0.16,0.012,z0+0.05,z0+0.07,brass(),"brass handle");
      }
      break;
    case "washer": {
      box(x,y,w,h,0,0.85,WHT,"washing machine (60×60×85)");
      door(x+w/2, y, 0.42);
      if (it.stacked) { box(x,y,w,h,0.85,1.70,WHT,"heat-pump dryer (stacked)"); door(x+w/2, y, 1.27); }
      break; }
    case "basin":
      box(x,y,w,h,0.40,0.85,WAL(w,0.45),"vanity cabinet, 2 drawers (one = laundry pull-out)");
      if (S) { box(x+w/2-0.12,y+h,0.24,0.012,0.80,0.815,brass(),"brass handle");
               box(x+w/2-0.12,y+h,0.24,0.012,0.58,0.595,brass(),"brass handle"); }
      box(x,y,w,h+0.01,0.85,0.88, S ? tmat("marble",w,h) : C.white, label+" — marble top at 88 cm");
      box(x+w/2-0.22,y+0.08,0.44,0.30,0.881,0.884,0xe9eef0,"undermount basin");
      if (S) { // wall-mounted brass spout + handle, like the photo
        box(x+w/2-0.015,y,0.03,0.16,1.02,1.045,brass(),"wall-mounted basin spout");
        box(x+w/2+0.16,y,0.05,0.03,1.00,1.05,brass(),"basin mixer handle");
      } else box(x+w/2-0.015,y+0.03,0.03,0.05,0.88,1.05,C.steel,"basin mixer");
      break;
    case "mirror":
      if (WH > (it.z0??1.1)) {
        const z0 = it.z0??1.1, z1 = clip(it.z1??1.85);
        if (S) {  // brass-framed mirror cabinet + two warm sconces
          box(x+0.12,y,w-0.24,h,z0,z1,brass(),"mirror cabinet, brass frame (socket inside)");
          box(x+0.14,y+h,w-0.28,0.004,z0+0.02,z1-0.02,new THREE.MeshPhongMaterial({color:PAL.mirror,shininess:120,specular:0xffffff}),"mirror");
          [x+0.05, x+w-0.05].forEach(sx => {
            box(sx-0.02,y,0.04,0.06,1.50,1.62,brass(),"brass wall sconce");
            const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.035,0.14,24),
                       new THREE.MeshBasicMaterial({color:0xfff1d0}));
            sh.position.set(sx, 1.70, y+0.09); world.add(sh);
            const L = new THREE.PointLight(0xffcf8a, 0.35, 2.5); L.position.set(sx, 1.70, y+0.15); world.add(L);
          });
        } else box(x,y,w,h,z0,z1,C.mirror,"mirror cabinet (socket inside)");
      }
      break;
    case "towel": {
      const z0 = it.z0??0.3, z1 = it.z1??1.5, m = () => S ? brass() : C.rail;
      box(x,y+0.03,0.025,0.03,z0,z1,m(),label); box(x+w-0.025,y+0.03,0.025,0.03,z0,z1,m(),label);
      for (let z=z0+0.05; z<z1; z+=0.12) box(x,y+0.04,w,0.02,z,z+0.02,m(),label+" (electric, hard-wired)");
      break; }
    case "trim":
      box(x,y,w,h,it.z0??0,clip(it.z1??2.15),WAL(Math.max(w,h),clip(it.z1??2.15)),label); break;
    case "slider":
      box(x,y,w,h,0,Math.min(2.05,WH),S ? tmat("walnut",h,2.05) : C.door,"sliding door (runs along the hall side)"); break;
  }
}
function door(cx, y, cz) {   // round machine door on the front (north) face
  const g = new THREE.CylinderGeometry(0.2,0.2,0.02,40); g.rotateX(Math.PI/2);
  const m = new THREE.Mesh(g, mat(0x9aa3ab)); m.position.set(cx, cz, y-0.01); world.add(m);
}

/* ---- views ---- */
const VIEWS = {
  bath: { pos:[4.3,5.6,4.3], target:[5.2,0.7,6.75] },
  door: { pos:[3.95,1.65,6.6], target:[6.3,1.05,6.5] },
  flat: { pos:[-3.5,9.5,11.5], target:[3.2,0,3.9] },
};
function view(n){ const v=VIEWS[n]; camera.fov = n==="door" ? 80 : 55; camera.updateProjectionMatrix(); camera.position.set(...v.pos); controls.target.set(...v.target); controls.update(); }
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => view(b.dataset.v));
/* ---- manual centering: double-click a surface, or pick a room ---- */
const pivot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({color:0xd0542c}));
pivot.visible = false; scene.add(pivot);
let pivotTimer = null, anim = null;
function centerOn(p, keepView = true) {                 // smoothly move the orbit centre to p (THREE.Vector3)
  const fromT = controls.target.clone(), fromC = camera.position.clone();
  const toT = p.clone(), toC = keepView ? fromC.clone().add(p.clone().sub(fromT)) : fromC;
  const t0 = performance.now(), dur = 350;
  anim = now => {
    const k = Math.min(1, (now - t0) / dur), e = k * (2 - k);
    controls.target.lerpVectors(fromT, toT, e); camera.position.lerpVectors(fromC, toC, e);
    if (k >= 1) anim = null;
  };
  pivot.position.copy(p); pivot.visible = true;
  clearTimeout(pivotTimer); pivotTimer = setTimeout(() => pivot.visible = false, 1500);
}
renderer.domElement.addEventListener("dblclick", e => {
  const m = new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  const r = new THREE.Raycaster(); r.setFromCamera(m, camera);
  const hit = r.intersectObjects(world.children, true).find(h => h.object.isMesh && !(h.object.material && h.object.material.transparent));
  if (hit) centerOn(hit.point);
});
document.getElementById("focus").onchange = e => {
  if (!e.target.value) return;
  const [x, y, z] = e.target.value.split(",").map(Number);
  centerOn(new THREE.Vector3(x, y, z));
  e.target.value = "";
};


/* ---- UI ---- */
const sel = document.getElementById("bath");
Object.keys(P.layouts.bathroom).forEach(n => { const o=document.createElement("option"); o.textContent=n; sel.appendChild(o); });
try { const v=localStorage.getItem("flat60-bath-v2"); if (v && P.layouts.bathroom[v]) sel.value=v; } catch(e) {}
sel.onchange = () => { try{localStorage.setItem("flat60-bath-v2",sel.value);}catch(e){} build(); };
document.getElementById("ceil").onchange = build;
document.getElementById("cut").onchange = build;
document.getElementById("finish").onchange = build;

/* ---- hover labels ---- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip");
renderer.domElement.addEventListener("mousemove", e => {
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables)[0];
  if (hit) { tip.textContent = hit.object.userData.label; tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px"; }
  else tip.style.display="none";
});

function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
build(); view("bath");
(function loop(now){ requestAnimationFrame(loop); if (anim) anim(now || performance.now()); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
