<!doctype html>
<html lang="en">

<body>

  <label>Finish <select id="finish"><option value="style">Green tiles + walnut + brass</option><option value="plain">Plain (layout only)</option></select></label>
  <label>Wood <select id="wood"></select></label>
  <label>Floor <select id="floortile"></select></label>
  <label>Small tiles height <select id="tileheight"><option value="band">2 rows above the bath</option><option value="full">To the ceiling (bath walls)</option></select></label>
  <label>Small tiles <select id="greentile"></select></label>
  <label>Big tiles <select id="bigtile"></select></label>
  <label>Lighting <select id="lighting"><option value="standard">Standard</option><option value="baked">Realistic — bathroom (Blender, prototype)</option></select></label>
  <label><input id="cut" type="checkbox"> Cut walls at 1.2 m</label>

    <option value="">—</option>

    <option value="5.17,0.9,6.7">Bathroom</option>
    <option value="2.0,1.0,7.0">Hall</option>
    <option value="3.4,0.8,-1.2">Balcony</option>
    <option value="3.25,0.0,3.9">Whole flat (middle)</option>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="plan-data.js?v=2026-11-24a"></script>
<script>
/* Plan coordinates (x east, y south, metres) map to three.js as  x → x,  y → z,  height → y. */
const P = window.PLAN;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);
const lin = c => (c && c.isColor) ? c : new THREE.Color(c).convertSRGBToLinear();   // sRGB hex -> linear colour
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3f2ee);
// soft "studio" environment so glossy tiles, brass, ceramics and the mirror have something to reflect
scene.environment = (() => {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(12, 6, 12), new THREE.MeshBasicMaterial({color: lin(0x9e978b), side: THREE.BackSide})));
  const lightPanel = (w, h, pos, rot, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(k, k * 0.96, k * 0.88)}));
    m.position.set(...pos); m.rotation.set(...rot); env.add(m);
  };
  lightPanel(6, 1.6, [0, 2.9, 0], [Math.PI / 2, 0, 0], 5);          // ceiling light
  lightPanel(3, 2.2, [-5.9, 1.4, -1], [0, Math.PI / 2, 0], 3);       // "window" left
  lightPanel(2, 1.6, [5.9, 1.6, 2], [0, -Math.PI / 2, 0], 1.6);      // fill right
  const pm = new THREE.PMREMGenerator(renderer);
  return pm.fromScene(env, 0.035).texture;
})();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(lin(0xffffff), lin(0xb9b3a6), 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(lin(0xffffff), 0.5); sun.position.set(-4, 9, -6); scene.add(sun);

const C = { wall:0xe9e7e1, shaft:0xbdb9ae, floor:0xcbbda6, tile:0xc9ccce, white:0xfbfbfb, wood:0xb88b5e,
            box:0xdedbd2, glass:0x9cc3e6, steel:0xa9adb2, rail:0xd0542c, mirror:0xcfe3ee, door:0xc6a27c };
let world = new THREE.Group(); scene.add(world);
const pickables = [];

function mat(c, opts={}) {
  if (c && c.isMaterial) return c;
  const o = Object.assign({color: lin(c), roughness: 0.85, metalness: 0}, opts); delete o.noEdges;
  return new THREE.MeshStandardMaterial(o);
}
// Box from plan rect (x,y,w,d) and height range z0..z1
function box(x,y,w,d,z0,z1,color,label,opts={}) {
  const g = new THREE.BoxGeometry(w, z1-z0, d);
  const m = new THREE.Mesh(g, mat(color, opts));
  m.position.set(x+w/2, (z0+z1)/2, y+d/2);
  world.add(m);
  if (!opts.transparent && !opts.noEdges && !(color && color.isMaterial && S)) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color:0x6b6b66}));
    e.position.copy(m.position); world.add(e);
  }
  if (label) { m.userData.label = label; pickables.push(m); }
  return m;
}
function prism(poly, z0, z1, color, label) {           // extruded plan polygon
  const s = new THREE.Shape(poly.map(([x,y]) => new THREE.Vector2(x, -y)));
  const g = new THREE.ExtrudeGeometry(s, {depth:z1-z0, bevelEnabled:false});
  g.rotateX(-Math.PI/2); g.translate(0, z0, 0);
  const m = new THREE.Mesh(g, mat(color)); world.add(m);
  world.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color:0x55554f})));
  if (label) { m.userData.label = label; pickables.push(m); }
}

function cyl(x, y, z0, z1, r, color, label) {         // vertical cylinder at plan point (x,y)
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, z1 - z0, 20), mat(color));
  m.position.set(x, (z0 + z1) / 2, y); world.add(m);
  if (label) { m.userData.label = label; pickables.push(m); }
  return m;
}

function pebble(W, H, n = 96) {                       // organic mirror outline, like the owner's sketch
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2; let px = Math.cos(t), py = Math.sin(t);
    px *= 1 - 0.14 * Math.max(0, py);                  // narrower towards the top
    px += 0.05 * Math.sin(2 * t + 0.6); py += 0.04 * Math.cos(3 * t + 0.3);
    py += 0.04 * px;                                   // slight tilt
    pts.push([px, py]);
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return pts.map(([px, py]) => new THREE.Vector2((px - (x0 + x1) / 2) / (x1 - x0) * W, (py - (y0 + y1) / 2) / (y1 - y0) * H));
}

/* ================= FINISHES ("Green & walnut" style from the reference photo) ================= */
let S = false;                                  // style on/off, set in build()
const PAL = { tile:"#1f5c40", grout:"#c9cfc6", walnut:"#3a2416", brass:0xb8914a, marble:"#efebe5",
              floor:"#e4ddd0", white:0xfbfaf6, mirror:0xc9d6da, glass:0xbfd8e6 };
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  t.encoding = THREE.sRGBEncoding; return t;
}
function dataTex(w, h, draw) {                    // linear texture (normal maps)
  const t = canvasTex(w, h, draw); t.encoding = THREE.LinearEncoding; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TEX = {
  // 2 vertical tiles of 7.5 × 30 cm, stack-bonded, glossy green with light grout  → covers 0.15 × 0.30 m
  // normal map for the small vertical tiles: 4 tiles x 2 rows of 7.5 x 30 cm -> covers 0.30 x 0.60 m.
  // Soft handmade waves, bevelled edges, sunken grout.
  tileN: { u:0.30, v:0.60, t: dataTex(512, 1024, (g, w, h) => {
    g.fillStyle = "rgb(128,128,255)"; g.fillRect(0, 0, w, h);
    const TW = 128, TH = 512;
    for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {
      const x = i * TW + 4, y = r * TH + 4, tw = TW - 8, th = TH - 8;
      for (let k = 0; k < 26; k++) {
        const rad = 10 + rnd() * 34, cx = x + rnd() * tw, cy = y + rnd() * th, dx = (rnd() - 0.5) * 36, dy = (rnd() - 0.5) * 36;
        g.fillStyle = "rgba(" + ((128 + dx) | 0) + "," + ((128 + dy) | 0) + ",250,0.35)";
        g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = "rgb(70,128,225)";  g.fillRect(x, y, 4, th);
      g.fillStyle = "rgb(186,128,225)"; g.fillRect(x + tw - 4, y, 4, th);
      g.fillStyle = "rgb(128,186,225)"; g.fillRect(x, y, tw, 4);
      g.fillStyle = "rgb(128,70,225)";  g.fillRect(x, y + th - 4, tw, 4);
    } }) },
  // stone-grey textured frame (mirror) -> 0.4 x 0.4 m
  stone: { u:0.4, v:0.4, t: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#5f5c57"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) {
      const c = (55 + rnd() * 80) | 0; g.fillStyle = "rgba(" + c + "," + (c - 2) + "," + (c - 6) + "," + (0.25 + rnd() * 0.4) + ")";
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
    } }) },
  // light warm stone for the vanity top -> 0.6 x 0.6 m
  stoneLight: { u:0.6, v:0.6, t: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#e8e3da"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) {
      const c = (200 + rnd() * 45) | 0; g.fillStyle = "rgba(" + c + "," + (c - 4) + "," + (c - 10) + ",0.35)";
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
    } }) },
  // walnut veneer (based on owner's photo, turned vertical): wavy grain, irregular spacing, cathedral arches,
  // darker streaks and pores. Periodic in both directions so it tiles without seams. Covers 0.6 x 1.2 m.
  walnut: { u:0.6, v:1.2, t: canvasTex(512, 1024, (g, w, h) => {
    const TAU = Math.PI * 2;
    // smooth periodic wobble along the board: sum of sines with whole cycles per texture height
    const wob = (y, ph, amp) => amp * (0.55 * Math.sin(TAU * y / h + ph[0]) + 0.3 * Math.sin(TAU * 2 * y / h + ph[1])
                                    + 0.15 * Math.sin(TAU * 5 * y / h + ph[2]));
    // base colour with soft lighter / darker bands across the width
    g.fillStyle = "#4b3020"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 14; i++) {
      const x = rnd() * w, bw = 20 + rnd() * 70, light = rnd() > 0.5;
      const gr = g.createLinearGradient(x - bw, 0, x + bw, 0);
      const c = light ? "rgba(122,84,52," : "rgba(30,17,9,";
      gr.addColorStop(0, c + "0)"); gr.addColorStop(0.5, c + (0.10 + rnd() * 0.15) + ")"); gr.addColorStop(1, c + "0)");
      g.fillStyle = gr; g.fillRect(x - bw, 0, bw * 2, h);
    }
    const line = (x0, ph, amp, width, col) => {          // one wavy grain line, drawn twice for horizontal wrap
      for (const dx of [-w, 0, w]) {
        g.beginPath();
        for (let y = 0; y <= h; y += 4) { const x = x0 + dx + wob(y, ph, amp); y ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.strokeStyle = col; g.lineWidth = width; g.stroke();
      }
    };
    // grain lines: clustered, irregular gaps, varying darkness and width
    let x = 0;
    while (x < w) {
      x += rnd() < 0.25 ? 14 + rnd() * 26 : 2 + rnd() * 7;    // mostly tight, sometimes a wide calm gap
      const ph = [rnd() * TAU, rnd() * TAU, rnd() * TAU], amp = 3 + rnd() * 14;
      const dark = rnd() < 0.8, a2 = dark ? 0.12 + rnd() * 0.38 : 0.06 + rnd() * 0.12;
      line(x, ph, amp, 0.6 + rnd() * (dark ? 2.4 : 3.5), dark ? `rgba(22,12,6,${a2})` : `rgba(150,104,66,${a2})`);
    }
    // cathedral arches: nested flame shapes pointing up
    for (let k = 0; k < 3; k++) {
      const cx = rnd() * w, top = rnd() * h, ph = [rnd() * TAU, rnd() * TAU, rnd() * TAU];
      for (let r = 1; r <= 7; r++) {
        g.beginPath();
        for (let t = -1; t <= 1.0001; t += 0.04) {
          const yy = top + Math.pow(Math.abs(t), 0.55) * (90 + r * 38), xx = cx + t * (10 + r * 11) + wob(yy, ph, 4);
          t === -1 ? g.moveTo(xx, yy) : g.lineTo(xx, yy);
        }
        g.strokeStyle = `rgba(24,13,7,${0.18 + rnd() * 0.25})`; g.lineWidth = 0.8 + rnd() * 1.8; g.stroke();
      }
    }
    // pores: tiny vertical dashes
    for (let i = 0; i < 9000; i++) {
      const px = rnd() * w, py = rnd() * h;
      g.fillStyle = rnd() > 0.3 ? `rgba(18,10,5,${0.10 + rnd() * 0.2})` : `rgba(140,96,60,${0.08 + rnd() * 0.1})`;
      g.fillRect(px, py, 0.8, 2 + rnd() * 6);
    }
  }) },
  // large-format stone-look tiles 120 x 60 in several colourways (see BIGTILES) -> each covers 1.2 x 0.6 m
  // white marble with grey veins → covers 1.0 × 0.5 m
  marble: { u:1.0, v:0.5, t: canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = PAL.marble; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9; i++) {
      g.strokeStyle = `rgba(120,120,125,${0.15 + rnd() * 0.3})`; g.lineWidth = 0.5 + rnd() * 1.5;
      g.beginPath(); let x = rnd() * w, y = 0; g.moveTo(x, y);
      while (y < h) { x += rnd() * 40 - 20; y += 15 + rnd() * 25; g.lineTo(x, y); } g.stroke();
    } }) },
  // cream floor tiles 60 × 60 → covers 0.6 × 0.6 m
  floor: { u:0.6, v:0.6, t: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = PAL.floor; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#cfc6b6"; g.lineWidth = 3; g.strokeRect(0, 0, w, h); }) },
  // vintage rug (dark green / red / cream) → covers whole rug
  rug: { u:1, v:1, t: canvasTex(256, 384, (g, w, h) => {
    g.fillStyle = "#5b1e1a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#e8dcc2"; g.fillRect(14, 14, w - 28, h - 28);
    g.fillStyle = "#16473a"; g.fillRect(26, 26, w - 52, h - 52);
    g.fillStyle = "#e8dcc2"; g.beginPath(); g.moveTo(w/2, 50); g.lineTo(w - 50, h/2); g.lineTo(w/2, h - 50); g.lineTo(50, h/2); g.closePath(); g.fill();
    g.fillStyle = "#7a2a22"; g.beginPath(); g.moveTo(w/2, 90); g.lineTo(w - 85, h/2); g.lineTo(w/2, h - 90); g.lineTo(85, h/2); g.closePath(); g.fill();
    for (let i = 0; i < 400; i++) { g.fillStyle = ["#c79b4b","#16473a","#7a2a22","#e8dcc2"][i % 4]; g.fillRect(rnd() * w, rnd() * h, 3, 3); }
  }) },
};
const MATP_EXTRA = {};
// Big-tile colourways, chosen with colour-triangle theory (walnut H22 + green H153 are ~2 corners of a triad):
const BIGTILES = {
  lavender: { name: "Lavender-grey ✓ chosen", base: "#bdb7c3", light: "rgba(214,209,219,A)", dark: "rgba(160,150,170,A)", grout: "#d4cfd8" },
  clay:     { name: "Dusty clay (opposite of green)",     base: "#ccaea4", light: "rgba(220,198,190,A)", dark: "rgba(180,146,132,A)", grout: "#dcc9c1" },
  white:    { name: "Warm white (neutral)",               base: "#e6e2db", light: "rgba(246,244,240,A)", dark: "rgba(210,201,188,A)", grout: "#eeebe6" },
  terrazzo: { name: "Light-grey terrazzo (ref. #5, #6)", base: "#c9c6bf", light: "rgba(228,226,221,A)", dark: "rgba(120,116,110,A)", grout: "#d8d6d0", chips: true },
  beige:    { name: "Beige (previous)",                    base: "#9a886b", light: "rgba(176,160,130,A)", dark: "rgba(118,101,76,A)",  grout: "#bfb39d" },
  calacatta:{ name: "Calacatta white marble (Deco)",      base: "#eeebe6", light: "rgba(250,249,246,A)", dark: "rgba(200,194,186,A)", grout: "#f1efeb", veins: "rgba(140,134,128,A)", rough: 0.22 },
  nero:     { name: "Nero black marble (Neo Deco)",       base: "#1d1d1f", light: "rgba(70,70,74,A)",    dark: "rgba(8,8,10,A)",      grout: "#2b2b2d", veins: "rgba(232,230,226,A)", rough: 0.2 },
  bone:     { name: "Bone / cream (mid-century)",         base: "#e3d8c4", light: "rgba(242,236,224,A)", dark: "rgba(196,182,158,A)", grout: "#ece5d8" },
  blush:    { name: "Blush plaster",                       base: "#d8beb2", light: "rgba(230,212,204,A)", dark: "rgba(184,150,138,A)", grout: "#e2d0c8" },
};
Object.entries(BIGTILES).forEach(([k, c]) => {
  TEX["bigtile_" + k] = { u:1.2, v:0.6, t: canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = c.base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) {                       // soft cloudy mottling
      const x = rnd() * w, y = rnd() * h, r = 14 + rnd() * 60, light = rnd() > 0.45;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, (light ? c.light : c.dark).replace("A", (0.05 + rnd() * 0.08).toFixed(3)));
      gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 1800; i++) {                      // fine stone specks
      g.fillStyle = (rnd() > 0.5 ? c.dark : c.light).replace("A", (0.10 + rnd() * 0.18).toFixed(3));
      const sz = 0.6 + rnd() * 1.8; g.fillRect(rnd() * w, rnd() * h, sz, sz);
    }
    if (c.chips) for (let i = 0; i < 900; i++) {          // terrazzo: irregular darker/lighter stone chips
      const cx = rnd() * w, cy = rnd() * h, r = 0.6 + rnd() * rnd() * 3.2, tone = rnd();
      g.fillStyle = tone < 0.55 ? `rgba(95,92,87,${0.35 + rnd() * 0.4})` : tone < 0.8 ? `rgba(150,146,138,${0.4 + rnd() * 0.3})` : `rgba(240,238,233,${0.5 + rnd() * 0.4})`;
      g.beginPath();
      for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 + rnd() * 0.6, rr = r * (0.6 + rnd() * 0.6);
        k ? g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : g.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
      g.closePath(); g.fill();
    }
    if (c.veins) for (let i = 0; i < 7; i++) {           // marble veins: long wandering, branching strokes
      let x = rnd() * w, y = rnd() < 0.5 ? 0 : rnd() * h, ang = (rnd() - 0.5) * 1.2 + (rnd() < 0.5 ? 0.6 : -0.6);
      const width = 0.6 + rnd() * 2.2, a = (0.25 + rnd() * 0.45).toFixed(2);
      g.strokeStyle = c.veins.replace("A", a); g.lineWidth = width; g.beginPath(); g.moveTo(x, y);
      for (let st = 0; st < 60; st++) {
        ang += (rnd() - 0.5) * 0.5; x += Math.cos(ang) * 9; y += Math.sin(ang) * 9 + 3; g.lineTo(x, y);
        if (rnd() < 0.06) { g.stroke(); g.lineWidth = width * 0.5; g.beginPath(); g.moveTo(x, y); }
      }

   Static bathroom surfaces are exported, Blender bakes how light bounces around (irradiance only, no colour),
   and the result comes back as a second UV set + an HDR "lightmap". Colours/textures stay live, so the
   Wood / tile menus still work. Must be re-baked after any layout change. */
const BAKE_BOX = { x0: 3.70, x1: 6.60, y0: 5.40, y1: 7.95 };        // plan metres
function bakeCandidates() {                                          // same list for export and for applying the bake
  const out = [], bb = new THREE.Box3();
  world.updateMatrixWorld(true);
  world.traverse(o => {
    if (!o.isMesh || !o.visible || o.userData.toggleId || o.userData.baked) return;
    const m = o.material;
    if (!m || m.transparent || m.isMeshBasicMaterial || (m.metalness === 1 && m.roughness < 0.1)) return;   // glass, emitters, mirror
    bb.setFromObject(o);
    if (bb.max.x < BAKE_BOX.x0 || bb.min.x > BAKE_BOX.x1 || bb.max.z < BAKE_BOX.y0 || bb.min.z > BAKE_BOX.y1) return;

    hdr("bake/lightmap.hdr"), hdr("bake/probe.hdr"),

// Baked mode: every static bathroom surface is swapped for Blender's version (real tub/WC/basin shapes, bevelled
// edges) lit by the lightmap and reflecting the 360° probe of the actual room. Props (x_* materials) are added.
function applyBake() {
  if (!BAKE_ON || !BAKED || !S) return;
  const add = (g, m, label) => {
    m.lightMap = BAKED.lightmap; m.lightMapIntensity = BAKE_INTENSITY;
    m.envMap = BAKED.probe; m.envMapIntensity = BAKE_ENV;
    const mesh = new THREE.Mesh(g, m); mesh.userData.baked = true;
    if (label) { mesh.userData.label = label; pickables.push(mesh); }
    world.add(mesh);
  };
  bakeCandidates().forEach((o, i) => {
    o.visible = false;                                               // removed in Blender (e.g. old bath boxes) -> stays hidden
    const e = BAKED.byKey["b" + i]; if (!e || !e.geometry.attributes.uv2) return;
    add(e.geometry, o.material.clone(), o.userData.label);
  });
  Object.entries(BAKED.byKey).forEach(([name, e]) => {                // props made in Blender
    if (name.startsWith("x_") && e.geometry.attributes.uv2) add(e.geometry, e.material.clone(), name.slice(2).replace(/_/g, " "));
  });
  world.traverse(o => {                                              // mirror, glass, moving parts reflect the real room too
    if (!o.isMesh || o.userData.baked || !o.material || o.material.isMeshBasicMaterial) return;
    const c = o.getWorldPosition(new THREE.Vector3());
    if (c.x > BAKE_BOX.x0 && c.x < BAKE_BOX.x1 && c.z > BAKE_BOX.y0 && c.z < BAKE_BOX.y1) {

      if (WH > (it.z0??1.1)) {
        const z0 = it.z0??1.1, z1 = clip(it.z1??1.85);
        if (S) {  // PEBBLE mirror (owner sketch): ~80 cm wide, organic shape, stone-grey textured frame
          const W = 0.80, Hm = z1 - z0, cx = x + w / 2, cz = (z0 + z1) / 2, rim = 0.035;
          const outer = pebble(W, Hm), inner = pebble(W - 2 * rim, Hm - 2 * rim);
          const shape = new THREE.Shape(outer); shape.holes.push(new THREE.Path(inner));
          const fg = new THREE.ExtrudeGeometry(shape, {depth: 0.022, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.005, bevelSegments: 3, curveSegments: 48});
          const frame = new THREE.Mesh(fg, tmat("stone", 1, 1)); frame.position.set(cx, cz, y + 0.004); world.add(frame);
          frame.userData.label = "pebble mirror ~80 cm, stone-grey textured frame"; pickables.push(frame);
          const face = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(inner), 48), mirrorMat());
          face.position.set(cx, cz, y + 0.016); world.add(face);
          face.userData.label = "mirror"; pickables.push(face);
        } else box(x,y,w,h,z0,z1,C.mirror,"mirror cabinet (socket inside)");
      }
      break;
    case "towel": {
      const z0 = it.z0??0.3, z1 = it.z1??1.5, m = () => S ? brass() : C.rail;
      box(x,y+0.03,0.025,0.03,z0,z1,m(),label); box(x+w-0.025,y+0.03,0.025,0.03,z0,z1,m(),label);
      for (let z=z0+0.05; z<z1; z+=0.12) box(x,y+0.04,w,0.02,z,z+0.02,m(),label+" (electric, hard-wired)");
      break; }
    case "trim":
      box(x,y,w,h,it.z0??0,clip(it.z1??2.15),WAL(Math.max(w,h),clip(it.z1??2.15)),label); break;
    case "slider":
      box(x,y,w,h,0,Math.min(2.05,WH),S ? tmat(WOODKEY,h,2.05) : C.door,"sliding door (runs along the hall side)"); break;
  }
}
function door(cx, y, cz) {   // round machine door on the front (north) face
  const g = new THREE.CylinderGeometry(0.2,0.2,0.02,40); g.rotateX(Math.PI/2);
  const m = new THREE.Mesh(g, mat(0x3c4248, {roughness: 0.15, metalness: 0.3})); m.position.set(cx, cz, y-0.01); world.add(m);
}

/* ---- manual centering: double-click a surface, or pick a room ---- */
const pivot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({color:0xd0542c}));
pivot.visible = false; scene.add(pivot);
let pivotTimer = null, anim = null;
function centerOn(p, keepView = true) {                 // smoothly move the orbit centre to p (THREE.Vector3)
  const fromT = controls.target.clone(), fromC = camera.position.clone();
  const toT = p.clone(), toC = keepView ? fromC.clone().add(p.clone().sub(fromT)) : fromC;
  const t0 = performance.now(), dur = 350;
  anim = now => {
    const k = Math.min(1, (now - t0) / dur), e = k * (2 - k);
    controls.target.lerpVectors(fromT, toT, e); camera.position.lerpVectors(fromC, toC, e);
    if (k >= 1) anim = null;
  };
  pivot.position.copy(p); pivot.visible = true;
  clearTimeout(pivotTimer); pivotTimer = setTimeout(() => pivot.visible = false, 1500);
}
renderer.domElement.addEventListener("dblclick", e => {
  const m = new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  const r = new THREE.Raycaster(); r.setFromCamera(m, camera);
  const hit = r.intersectObjects(world.children, true).find(h => h.object.isMesh && !(h.object.material && h.object.material.transparent));
  if (hit) centerOn(hit.point);
});
document.getElementById("focus").onchange = e => {

  centerOn(new THREE.Vector3(x, y, z));
  e.target.value = "";
};

{ const cv = renderer.domElement; let down = null;
  cv.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
  cv.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || window.__cmtPinning) return;
    const r = new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    const hit = r.intersectObjects(world.children, true).find(h => h.object.isMesh && !(h.object.material && h.object.material.transparent));
    if (hit && hit.object.userData.toggleId) { const id = hit.object.userData.toggleId; OPENSTATE[id] = !OPENSTATE[id]; }
  });

});
