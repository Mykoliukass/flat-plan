<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment History</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6f6e68; --acc:#1f5c40; --line:#e3e0d8; --pin:#d0542c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --card:#20201d; --ink:#ecebe6; --muted:#a3a29b; --acc:#6fbf95; --line:#34332f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:28px 16px 56px; }
  nav a { color:var(--acc); text-decoration:none; font-size:14px; margin-right:14px; }
  h1 { font-size:24px; margin:14px 0 4px; }
  p.lead { color:var(--muted); margin:0 0 18px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; padding:4px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .chip.on { border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .badge { color:#fff; border-radius:9px; padding:0 8px; font-size:12px; font-weight:700; }
  .body { margin:6px 0 4px; white-space:pre-wrap; }
  .decision { font-weight:600; font-size:14px; margin-top:6px; }
  .note { color:var(--muted); font-size:14px; }
  .where a { color:var(--acc); }
  .empty { color:var(--muted); padding:20px 0; }
</style>
</head>
<body>
<main>
  <nav><a href="./">← Home</a><a href="plan3d.html">3D view</a><a href="plan.html">2D plan</a></nav>
  <h1>Comment history</h1>
  <p class="lead">Every comment left on the plans, with what we decided about it.</p>
  <div class="stats" id="filters"></div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>

<script>window.COMMENTS_PAGE = "history";</script>
<script src="comments.js?v=6"></script>
<script>
(async function () {
  const list = document.getElementById("list"), filters = document.getElementById("filters");
  const cfg = COMMENTS_CONFIG, isNewKey = cfg.key.startsWith("sb_");
  const headers = Object.assign({ apikey: cfg.key }, isNewKey ? {} : { Authorization: "Bearer " + cfg.key });
  let rows = [], status = {};
  try {
    const [r1, r2] = await Promise.all([
      fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/comments?select=*&order=created_at.desc", { headers }),
      fetch("comments-status.json?t=" + Date.now()),
    ]);
    if (!r1.ok) throw new Error("database " + r1.status);
    rows = await r1.json();
    if (r2.ok) status = await r2.json();
  } catch (e) { list.innerHTML = `<p class="empty">Couldn't load comments (${e.message}).</p>`; return; }

  // which room a pinned spot is in (plan metres: x east, y south)
  const room = (x, y) => y < 0 ? "Balcony" : x >= 3.85 ? (y < 5.45 ? "Bedroom" : "Bathroom") : (y > 6.1 ? "Hall" : "Living room / kitchen");
  const stateOf = c => (status[c.id] && STATUS[status[c.id].status]) ? status[c.id].status : "open";
  const OPEN = { label: "● Open", color: "#d0542c" };
  const counts = { all: rows.length, open: 0, done: 0, declined: 0, later: 0 };
  rows.forEach(c => counts[stateOf(c)]++);

  let current = "all";
  const defs = [["all", "All"], ["open", "Open"], ["done", "Done"], ["declined", "Declined"], ["later", "Later"]];
  defs.forEach(([k, label]) => {
    const b = document.createElement("button"); b.className = "chip" + (k === current ? " on" : "");
    b.textContent = `${label} (${counts[k]})`;
    b.onclick = () => { current = k; [...filters.children].forEach(x => x.classList.toggle("on", x === b)); render(); };
    filters.appendChild(b);
  });

  function render() {
    const shown = rows.filter(c => current === "all" || stateOf(c) === current);
    list.innerHTML = shown.length ? "" : `<p class="empty">Nothing here.</p>`;
    shown.forEach(c => {
      const st = stateOf(c), S_ = st === "open" ? OPEN : STATUS[st], info = status[c.id] || {};
      const card = document.createElement("div"); card.className = "card";
      const when = new Date(c.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      card.innerHTML = `
        <div class="meta"><span class="badge"></span><b class="who"></b><span>${when}</span><span>#${c.id}</span><span>${c.page.toUpperCase()}</span></div>
        <div class="body"></div>
        <div class="meta where"></div>
        <div class="decision"></div><div class="note"></div>`;
      const badge = card.querySelector(".badge"); badge.textContent = S_.label; badge.style.background = S_.color;
      card.querySelector(".who").textContent = c.name || "Anonymous";
      card.querySelector(".body").textContent = c.body;                        // textContent: no HTML injection
      const where = card.querySelector(".where");
      if (c.x != null) {
        where.append("📍 " + room(c.x, c.y) + " · ");
        const a = document.createElement("a");
        a.href = `plan3d.html?focus=${c.x.toFixed(2)},${c.y.toFixed(2)},${(c.z ?? 1).toFixed(2)}`; a.textContent = "show in 3D";
        where.appendChild(a);
      }
      if (c.layout) where.append((c.x != null ? " · " : "") + "bathroom option: " + c.layout);
      const dec = card.querySelector(".decision");
      if (info.decision) { dec.textContent = "Decision: " + info.decision + (info.date ? "  (" + info.date + ")" : ""); dec.style.color = S_.color; }
      card.querySelector(".note").textContent = info.note || "";
      list.appendChild(card);
    });
  }
  render();
})();
</script>
</body>
</html>
